# Render blueprint for Betbooks.
# One web service: the Node server builds and serves the React client.
# Create it via Render → New → Blueprint, pointed at this repo. Secrets
# (sync:false) are filled in the Render dashboard, never committed.
# See DEPLOY.md for the full walkthrough.
#
# ── PRODUCTION: paid Starter plan with a persistent disk ──
# The service runs on the paid Starter instance and mounts a 1 GB disk at
# /var/data. The SQLite database lives on that disk (via DB_PATH), so it
# survives every deploy and restart, and the service no longer sleeps.
services:
  - type: web
    name: betbooks
    runtime: node
    plan: starter
    # --include=dev forces devDependencies (Vite, the build tool) to install
    # even though NODE_ENV=production, which otherwise skips them and the
    # client build fails with "vite: not found".
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    # Persistent disk — keeps the SQLite database across deploys/restarts.
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true  # Render generates a strong secret once
      # The database file lives on the persistent disk mounted above.
      - key: DB_PATH
        value: /var/data/betbooks.db
      # Public URL — set to your onrender.com URL after the first deploy.
      - key: APP_URL
        sync: false
      # Stripe (Pro billing) — leave blank until you're ready to charge.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_PRICE_LABEL
        sync: false
      # Password-reset email (any SMTP provider) — leave blank for now.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
